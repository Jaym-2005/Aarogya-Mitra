<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Medical Chatbot</title>

<link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  /* ChatGPT-like input styling */
  .input_wrapper {
    display: flex;
    align-items: center;
    border: 1px solid #ccc;
    border-radius: 25px;
    padding: 5px 10px;
    background: #fff;
    position: relative;
  }
  .input_wrapper textarea {
    border: none;
    resize: none;
    outline: none;
    flex: 1;
    padding: 5px 10px;
    border-radius: 20px;
  }
  .input_wrapper img.preview {
    max-height: 40px;
    max-width: 40px;
    margin-right: 5px;
    border-radius: 5px;
    object-fit: cover;
  }
  .attach-btn {
    background: transparent;
    border: none;
    font-size: 20px;
    cursor: pointer;
    margin-right: 5px;
    color: #555;
  }
</style>
</head>
<body class="bg-funky">

<div class="container mt-4">
  <h3 class="heading text-center">🩺Aarogya Mitra</h3>

  <div class="messaging" role="main" aria-label="Chat area">
    <div id="chat-box" class="msg_history" aria-live="polite">
      <div class="incoming_msg">
        <div class="incoming_msg_img">
          <img src="https://ptetutorials.com/images/user-profile.png" alt="bot avatar">
        </div>
        <div class="received_msg">
          <div class="received_withd_msg">
            <p>Hello! 👋 I’m your medical assistant. Ask me anything about the disease.</p>
            <span class="time_date" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="type_msg">
      <div class="input_wrapper">
        <button id="camera-btn" class="attach-btn" title="Attach image"><i class="fa fa-camera"></i></button>
        <img id="image-preview" class="preview" style="display:none;" />
        <textarea id="user-input" rows="1" placeholder="Type your question here" aria-label="Type your question"></textarea>
        <input type="file" id="file-input" accept="image/*" style="display:none;">
        <button id="send-btn" class="msg_send_btn" title="Send message" aria-label="Send">
          <i class="fa fa-paper-plane" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="credit">Medibot SIH Prototype</div>
</div>

<script>
const chatBox = document.getElementById('chat-box');
const inputEl = document.getElementById('user-input');
const fileInput = document.getElementById('file-input');
const cameraBtn = document.getElementById('camera-btn');
const sendBtn = document.getElementById('send-btn');
const imagePreview = document.getElementById('image-preview');

cameraBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', ()=>{
  const file = fileInput.files[0];
  if(file){
    imagePreview.src = URL.createObjectURL(file);
    imagePreview.style.display = 'block';
  } else {
    imagePreview.style.display = 'none';
  }
});

function formatTimestamp(d = new Date()){
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  let h = d.getHours(); const m = String(d.getMinutes()).padStart(2,'0');
  const ampm = h >= 12 ? 'PM':'AM'; h = h%12||12;
  const date = `${months[d.getMonth()]} ${d.getDate()}`;
  return `${h}:${m} ${ampm} | ${date}`;
}
function scrollToBottom(){ chatBox.scrollTop = chatBox.scrollHeight; }

function createBotBubble(text){
  const wrapper=document.createElement('div'); wrapper.className='incoming_msg';
  const imgDiv=document.createElement('div'); imgDiv.className='incoming_msg_img';
  const img=document.createElement('img'); img.src='https://ptetutorials.com/images/user-profile.png'; img.alt='bot';
  imgDiv.appendChild(img); const msgDiv=document.createElement('div'); msgDiv.className='received_msg';
  const inner=document.createElement('div'); inner.className='received_withd_msg';
  const p=document.createElement('p'); p.textContent=text; inner.appendChild(p);
  const ts=document.createElement('span'); ts.className='time_date'; ts.textContent=formatTimestamp(); inner.appendChild(ts);
  msgDiv.appendChild(inner); wrapper.appendChild(imgDiv); wrapper.appendChild(msgDiv); return wrapper;
}

function createUserBubble(text, file=null){
  const wrapper=document.createElement('div'); wrapper.className='outgoing_msg';
  const sent=document.createElement('div'); sent.className='sent_msg';
  const p=document.createElement('p'); p.textContent=text; sent.appendChild(p);
  if(file){
    const imgPreview=document.createElement('img'); imgPreview.src=URL.createObjectURL(file);
    imgPreview.style.maxWidth='200px'; imgPreview.style.display='block'; imgPreview.style.marginTop='5px'; sent.appendChild(imgPreview);
  }
  const ts=document.createElement('span'); ts.className='time_date'; ts.textContent=formatTimestamp(); sent.appendChild(ts);
  wrapper.appendChild(sent); return wrapper;
}

function createTypingIndicator(){
  const wrapper=document.createElement('div'); wrapper.className='incoming_msg typing_msg'; wrapper.dataset.typing='1';
  const imgDiv=document.createElement('div'); imgDiv.className='incoming_msg_img';
  const img=document.createElement('img'); img.src='https://ptetutorials.com/images/user-profile.png'; img.alt='bot';
  imgDiv.appendChild(img); const msgDiv=document.createElement('div'); msgDiv.className='received_msg';
  const inner=document.createElement('div'); inner.className='received_withd_msg';
  const p=document.createElement('p'); p.textContent='⏳ Typing...'; inner.appendChild(p); msgDiv.appendChild(inner);
  wrapper.appendChild(imgDiv); wrapper.appendChild(msgDiv); return wrapper;
}

let sending=false;

async function sendMessage(){
  if(sending) return;
  const raw=inputEl.value.trim();
  const file=fileInput.files[0];
  if(!raw && !file) return;

  const userBubble=createUserBubble(raw || (file ? file.name:''), file);
  chatBox.appendChild(userBubble); scrollToBottom();

  inputEl.value=''; fileInput.value=''; imagePreview.style.display='none';
  inputEl.style.height='auto'; sendBtn.disabled=true; inputEl.disabled=true; sending=true;

  const typingNode=createTypingIndicator(); chatBox.appendChild(typingNode); scrollToBottom();

  try{
    let resp;
    if(file){
      const formData=new FormData(); formData.append('image',file); if(raw) formData.append('question',raw);
      resp=await fetch('/ask',{method:'POST',body:formData});
    } else {
      const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),20000);
      resp=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:raw}),signal:controller.signal});
      clearTimeout(timeout);
    }
    if(typingNode.parentNode) typingNode.parentNode.removeChild(typingNode);

    if(!resp.ok) chatBox.appendChild(createBotBubble(`⚠️ Server error (${resp.status})`));
    else{
      const data=await resp.json();
      const answer=(data && (data.answer||data.reply||data.text))||'⚠️ No answer returned by server.';
      chatBox.appendChild(createBotBubble(answer));
    }
  } catch(err){
    if(typingNode.parentNode) typingNode.parentNode.removeChild(typingNode);
    let msg='⚠️ Network error: could not reach server.'; if(err.name==='AbortError') msg='⚠️ Request timed out.';
    chatBox.appendChild(createBotBubble(msg)); console.error(err);
  } finally{
    sending=false; sendBtn.disabled=false; inputEl.disabled=false; inputEl.focus(); scrollToBottom();
  }
}

inputEl.addEventListener('input',()=>{ inputEl.style.height='auto'; inputEl.style.height=(inputEl.scrollHeight)+'px'; });
sendBtn.addEventListener('click',sendMessage);
inputEl.addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } });
window.addEventListener('load',()=>{ inputEl.focus(); scrollToBottom(); });
</script>

</body>
</html>
